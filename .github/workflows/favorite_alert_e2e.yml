name: Favorite Alert E2E

# 찜 → 재입고 알림이 실제로 텔레그램까지 도달하는지 확인한다.
# 유료 전환의 근거인데 찜이 오래 깨져 있어서 한 번도 실증되지 않았다.
#
# 지정한 계정에만 실행별 테스트 이벤트를 보내고 소유 fixture만 정리한다.
# 실행 후 텔레그램 DM이 왔는지는 사람이 확인해야 한다.

on:
  workflow_dispatch:
    inputs:
      uid:
        description: "알림을 받을 사용자 uid (텔레그램 연결된 계정)"
        required: true
        type: string

jobs:
  e2e:
    runs-on: [self-hosted, coffee-crawler]
    env:
      TEST_UID: ${{ inputs.uid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.test.txt
          npm ci --no-audit --no-fund

      - name: Setup Firebase credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: echo "$FIREBASE_CREDENTIALS" > firebase_credentials.json

      - name: Allocate unique test run
        id: fixture
        run: node -e 'console.log("run_id=" + require("node:crypto").randomUUID())' >> "$GITHUB_OUTPUT"

      - name: Create owned test event (existing eligible favorite preferred)
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_CREDENTIALS }}
          TEST_RUN_ID: ${{ steps.fixture.outputs.run_id }}
        run: node scripts/test-favorite-alert-e2e.mjs --uid "$TEST_UID" --run-id "$TEST_RUN_ID" --setup

      - name: Send only the scoped test alert
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase_credentials.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_RUN_ID: ${{ steps.fixture.outputs.run_id }}
        run: python scripts/send_favorite_alerts.py --uid "$TEST_UID" --event-id "e2e-$TEST_RUN_ID"

      # Delivery receipts are retained; existing favorites are never deleted.
      - name: Cleanup only this run's owned fixtures
        if: ${{ always() && steps.fixture.outputs.run_id != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_CREDENTIALS }}
          TEST_RUN_ID: ${{ steps.fixture.outputs.run_id }}
        run: node scripts/test-favorite-alert-e2e.mjs --uid "$TEST_UID" --run-id "$TEST_RUN_ID" --cleanup
