name: Firestore Rules Test

# 규칙이 실제로 막는지 에뮬레이터로 확인한다. 배포 권한과 무관하게 돌아야
# 하므로 배포 워크플로우와 분리했다.
#
# 확인하는 것: 사용자가 자기 문서에 plan='premium'을 쓸 수 없는가.
# 이 한 줄이 뚫리면 유료화 게이팅이 아무리 정확해도 무의미하다.

on:
  push:
    paths:
      - "firestore.rules"
      - "scripts/__tests__/firestore-rules.test.mjs"
      - ".github/workflows/firestore_rules_test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 에뮬레이터는 JVM에서 돈다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run rules tests
        run: |
          npx -y firebase-tools@13 emulators:exec \
            --only firestore \
            --config firebase.rules-test.json \
            --project demo-coffee-rules \
            "node scripts/__tests__/firestore-rules.test.mjs"
