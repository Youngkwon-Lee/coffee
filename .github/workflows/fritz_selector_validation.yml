name: Temporary Fritz selector validation cleanup

on:
  push:
    branches:
      - fix/fritz-selector-20261002

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale temporary validation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN_ID in 36941163864 36941341758; do
            curl --fail-with-body -L               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel"               || true
          done
