# 크롤러 기본 설정
crawler:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  request_timeout: 30
  retry_count: 3
  retry_delay: 5

# 카페별 크롤러 설정
cafes:
  centercoffee:
    label: "센터커피"
    type: "html"
    url: "https://centercoffee.co.kr/67"
    schedule: "0 0 * * 1"
    active: true
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    page_delay: 2
    selectors:
      product_list_container: ".shop-grid"
      product_item: ".shop-item"
      product_link: "a.shop-item-thumb"
      product_title: ".shop-title"
      product_price: ".pay"
      product_image: "img.org_img"
      pagination_container: "nav.paging-block"
      next_page: "ul.pagination li:not(.active) a"

  fritz:
    label: "프릳츠커피"
    type: "html"
    url: "https://m.fritz.co.kr/product/list.html?cate_no=48"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 2
    selectors:
      product_list_container: "ul.column2"
      product_item: "li.item"
      product_link: ".box > a"
      product_title: ".name a"
      product_price: ".price"
      product_image: "img.thumb"
      pagination_container: "ul.pagination"
      next_page: "ul.pagination li:not(.active) a"
      fetch_product_detail: true
      product_description: ".description2"
      product_origin: "div[data-empty='true']"
      product_processing: "div[data-empty='true']"
      product_flavor_notes: "div.description2:-soup-contains('Flavor Notes')"

  namusairo:
    label: "나무사이로"
    type: "html"
    url: "https://m.namusairo.com/category/원두/25/"
    schedule: "0 0 * * 1"
    active: true
    selectors:
      product_list_container: ".prdList"
      product_item: ".prdList > li"
      product_link: ".thumbnail a"
      product_title: ".name"
      product_price: ".description"
      product_image: ".thumbnail img"
      pagination_container: ".paging"
      next_page: ".next"

  terarosa:
    label: "테라로사"
    type: "terarosa"
    # 기존 /market 경로는 robots.txt 에서 차단(Disallow) + 404 반환됨
    url: "https://terarosa.com/product/list/?category=12"
    api_url: "https://terarosa.com/api/product/list/"
    schedule: "0 0 * * *"
    active: true
    page_size: 60
    goto_page: 1

  momoscoffee:
    label: "모모스커피"
    type: "html"
    url: "https://m.momos.co.kr/custom/sub/product_category/sd_shop_roasted_bean.html"
    schedule: "0 0 * * 1"
    active: true
    selectors:
      # 2026-08: 카페24 → imweb 개편으로 .prdList가 사라져 83일간 0건 수집이었다.
      product_list_container: "._item_wrap"
      product_item: ".shop-item"
      product_link: ".item-thumbs a"
      product_title: ".item-pay h2"
      product_price: ".item-pay .pay"
      product_image: ".item-thumbs img"
      pagination_container: ".paging"
      next_page: ".next"

  tailorcoffee:
    label: "테일러커피"
    type: "html"
    url: "https://tailorcoffee.com/product/list.html?cate_no=4"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      product_list_container: ".prdList"
      product_item: ".prdList > li.xans-record-"
      product_link: "a"
      product_title: ".prd_name span"
      product_price: "span:contains('원')"
      product_image: "img"

  elcafe:
    label: "엘카페커피로스터스"
    type: "html"
    url: "https://elcafe.co.kr/category/원두/49/"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      product_list_container: ".xans-product-listnormal"
      product_item: ".sp-product-item.xans-record-"
      product_link: "a.sp-product-item-thumb-href"
      product_title: ".sp-product-name"
      product_price: ".sp-product-spec"
      product_image: "img"
      fetch_product_detail: true
      product_description: ".sp-product-spec"

  defaultvalue:
    label: "디폴트벨류"
    type: "html"
    url: "https://defaultvalue.kr/product/list.html?cate_no=23"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      product_list_container: ".prdList"
      product_item: "li.xans-record-"
      product_link: ".prdImg a"
      product_title: ".name"
      product_price: ".prdPrice"
      product_image: ".prdImg img"
      pagination_container: ".xans-product-normalpaging"
      next_page: ".xans-product-normalpaging a:not(.this)"

  deepbluelake:
    label: "딥블루레이크"
    type: "html"
    url: "https://dblcoffee.com/product/list.html?cate_no=24"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      product_list_container: "ul.prdList.column3"
      product_item: "li.item.xans-record-"
      product_link: ".prdImg a"
      product_title: ".name"
      product_price: ".prdPrice"
      product_image: ".prdImg img"
      pagination_container: ".xans-product-normalpaging"
      next_page: ".xans-product-normalpaging a:not(.this)"

  bunkercompany:
    label: "벙커컴퍼니"
    # 식스샵(sixshop) 플랫폼이라 상품을 JS로 그린다. 정적 HTML에는
    # class="shopProductWrapper skeleton"인 자리표시자("제목","가격")만 있어
    # 크롤러가 전부 걸러냈다. 렌더링 후에는 30개가 정상적으로 나온다.
    type: "selenium"
    url: "https://bunkercompany.co.kr/shop"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      product_list_container: "#productListWrapper42703510"
      product_item: ".shopProductWrapper"
      # 항목 자체가 .shopProductWrapper라 하위에서 같은 클래스를 다시 찾으면 안 된다.
      product_link: "a"
      product_title: ".shopProduct.productName"
      product_price: ".shopProduct.price"
      product_image: ".thumb.img"
      pagination_container: ".productListPage"
      next_page: ".productListPage:not(.now)"

  lowkey:
    label: "로우키"
    type: "html"
    url: "https://lowkeycoffee.com/shop/list-cf"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    page_delay: 3
    selectors:
      # 2026-08: 사이트 개편으로 .sct_li가 사라져 23일간 0건이었다.
      # .sct-item 자체가 <a>라 product_link는 항목 자신을 쓴다(빈 값 = self).
      product_list_container: ".sct-grid"
      product_item: ".sct-item"
      product_link: ""
      product_title: ".sct-name"
      product_price: ".sct-price"
      product_image: ".sct-thumb img"
      pagination_container: ".pagination"
      next_page: ".pagination .page-link"

  bonanza:
    label: "보난자"
    type: "html"
    url: "https://bonanzacoffee.kr/53"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    page_delay: 2
    selectors:
      product_list_container: ".shop-content"
      product_item: ".shop-item"
      product_link: "a"
      product_title: ".item-detail"
      product_price: ".item-detail"
      product_image: "img"

# 기본 필터링 설정

  # 2026-08-05 재등록. 아래 5곳은 설정에서 빠진 채 DB에만 83일 된 데이터가 남아
  # 있었다(총 58개, 전체 268개의 22%). 사용자에겐 낡은 가격이 최신처럼 보이고
  # 재입고 알림도 오지 않던 상태다.
  biroso:
    label: "비로소커피"
    type: "html"
    url: "https://birosocoffee.com/product/list.html?cate_no=24"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    selectors:
      # 카페24 표준 구조. 상품명은 .prdImg img의 alt에서 온다.
      product_list_container: ".prdList"
      product_item: ".prdList > li"
      product_link: ".prdImg a"
      product_title: ".prdImg img"
      product_price: ".xans-product-listitem li span"
      product_image: ".prdImg img"
      pagination_container: ".xans-product-normalpaging"
      next_page: ".next"
  oats:
    label: "오츠커피"
    type: "html"
    url: "https://oatscoffee.kr/product/list.html?cate_no=24"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    selectors:
      product_list_container: ".prdList"
      product_item: ".prdList > li"
      product_link: ".prdImg a"
      product_title: ".prdImg img"
      product_price: ".xans-product-listitem li span"
      product_image: ".prdImg img"
      pagination_container: ".xans-product-normalpaging"
      next_page: ".next"
  pontcoffee:
    label: "폰트커피"
    type: "html"
    # cate_no=32(SHOP)는 도매파트너 전용이라 로그인 없이는 alert만 돌아온다.
    # 소매 원두는 cate_no=29(Coffee).
    url: "https://pontcoffee.com/product/list.html?cate_no=29"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    selectors:
      product_list_container: ".prdList"
      product_item: ".prdList > li"
      product_link: ".prdImg a"
      product_title: ".prdImg img"
      product_price: ".xans-product-listitem li span"
      product_image: ".prdImg img"
      pagination_container: ".xans-product-normalpaging"
      next_page: ".next"
  anthracite:
    label: "앤트러사이트"
    type: "html"
    url: "https://anthracitecoffee.com/shop"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    selectors:
      # imweb. 모모스커피와 같은 구조이고, 항목 자체가 <a>라 product_link는 비운다.
      product_list_container: "._item_wrap"
      product_item: ".shop-item"
      product_link: ""
      product_title: ".item-pay h2"
      product_price: ".item-pay .pay"
      product_image: ".shop-item-thumb img"
      pagination_container: ".paging"
      next_page: ".next"
  beanbrothers:
    label: "빈브라더스"
    type: "html"
    url: "https://www.beanbrothers.co.kr/goods/goods_list.php?cateCd=007001"
    schedule: "0 0 * * 1"
    active: true
    encoding: "utf-8"
    selectors:
      # 고도몰(godomall)
      product_list_container: ".goods_list"
      product_item: ".goods_list_item"
      product_link: "a"
      product_title: ".item_name"
      product_price: ".item_price"
      product_image: "img"
      pagination_container: ".paging"
      next_page: ".next"
