# 데이터 저장 설정
storage:
  type: "firebase"  # firebase 또는 local
  local:
    output_dir: "data"
    image_dir: "data/images"
  firebase:
    collection_beans: "beans"
    collection_cafes: "cafes"
    collection_logs: "crawl_logs"
    storage_bucket: "trusty-bearing-428402-a7.appspot.com"
    image_path: "bean_images"
    bean_fields:
      - name: "altitude"
        type: "string"
      - name: "brand"
        type: "string"
      - name: "category"
        type: "string"
        nullable: true
      - name: "createdAt"
        type: "timestamp"
      - name: "flavor"
        type: "string"
      - name: "flavor_notes"
        type: "string"
        nullable: true
      - name: "image"
        type: "string"
        nullable: true
      - name: "link"
        type: "string"
        nullable: true
      - name: "name"
        type: "string"
      - name: "origin"
        type: "string"
      - name: "price"
        type: "string"
      - name: "process"
        type: "string"
      - name: "producer"
        type: "string"
      - name: "region"
        type: "string"
      - name: "roast"
        type: "string"
      - name: "variety"
        type: "string"
      - name: "active"
        type: "boolean"
        default: true
      - name: "updatedAt"
        type: "timestamp"

# 로깅 설정
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/crawler.log"
  max_size: 10485760  # 10MB
  backup_count: 5 