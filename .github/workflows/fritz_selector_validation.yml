name: Temporary full crawler validation

on:
  push:
    branches:
      - fix/fritz-selector-20261002

jobs:
  full-self-hosted:
    runs-on: [self-hosted, coffee-crawler]
    env:
      DISABLE_FIREBASE: "true"
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate all active cafes on production runner
        run: |
          PYROOT=/home/yk/actions-runner-coffee/_work/_tool/Python/3.9.25/x64
          export LD_LIBRARY_PATH="$PYROOT/lib:${LD_LIBRARY_PATH:-}"
          PY="$PYROOT/bin/python"
          "$PY" --version
          mkdir -p data reports logs
          "$PY" scripts/test_bean_filter.py
          "$PY" scripts/run_crawler.py --all --dry-run --output data/beans_full_validation.json
          "$PY" scripts/validate_crawl_output.py data/beans_full_validation.json
          "$PY" - <<'PY'
          import json
          from collections import Counter
          rows = json.load(open("data/beans_full_validation.json", encoding="utf-8"))
          counts = Counter(r.get("brand") for r in rows)
          if counts.get("프릳츠커피", 0) == 0:
              raise SystemExit("Fritz missing from full validation")
          print(f"Full validation rows: {len(rows)}")
          print(f"Fritz full-run rows: {counts['프릳츠커피']}")
          print("Brands:", dict(sorted(counts.items())))
          PY
