name: Coffee Crawler Auto Update

on:
  # 매일 실행 (오전 6시 KST = 21:00 UTC)
  # 재입고/가격 알림 상품을 위해 주 1회 -> 매일로 상향 (docs/MONETIZATION.md)
  schedule:
    - cron: '0 21 * * *'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (only sample data)'
        required: false
        default: false
        type: boolean
      specific_cafe:
        description: 'Run for specific cafe (optional)'
        required: false
        default: ''
        type: string

jobs:
  crawl-validate-and-apply:
    # 자체 러너(홈 데스크톱)로 돌린다. lowkeycoffee.com과 bunkercompany.co.kr이
    # GitHub Actions IP를 막아 각각 CI/로컬에서만 0건이 나오던 문제가 있었는데,
    # 데스크톱 IP에서는 둘 다 200으로 응답한다.
    runs-on: [self-hosted, coffee-crawler]
    env:
      # 자체 러너에서는 벙커컴퍼니도 정상 수집된다(GitHub IP 차단이 원인이었음).
      # 예외를 비워 두어야 수집이 멈추면 즉시 빨갛게 뜬다.
      ALLOW_ZERO_BRANDS: ""
      # 텔레그램 발행/알림 (미설정 시 관련 스텝 자동 스킵)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    # 자체 러너에는 무비밀번호 sudo가 없다. 이 라이브러리들은 EasyOCR(선택 기능)용이고
    # 없으면 경고 후 건너뛰므로 수집 자체는 영향받지 않는다.
    - name: Install system dependencies
      if: ${{ github.event.inputs.test_mode != 'true' && runner.environment == 'github-hosted' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 libglib2.0-dev
    
    - name: Install Python dependencies (test mode fast)
      if: ${{ github.event.inputs.test_mode == 'true' }}
      run: |
        pip install --upgrade pip
        pip install -r requirements.test.txt

    - name: Install Python dependencies (full)
      if: ${{ github.event.inputs.test_mode != 'true' }}
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Node dependencies
      run: |
        npm install
    
    - name: Setup Firebase credentials
      env:
        FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      run: |
        echo "$FIREBASE_CREDENTIALS" > firebase_credentials.json
        export GOOGLE_APPLICATION_CREDENTIALS="firebase_credentials.json"

    - name: Ensure output directories
      run: |
        mkdir -p data reports logs

    # 크롤 전에 확인한다. 필터가 비면 굿즈·드립백·선물세트가 원두로 저장되고,
    # 로그는 계속 성공으로 남는다(실제로 61건이 그렇게 들어왔다).
    # 저장한 뒤 발견하면 Firestore를 되돌려야 하므로 여기서 먼저 막는다.
    - name: Check bean filter
      run: python scripts/test_bean_filter.py

    - name: Run coffee crawler (all cafes, dry-run artifact only)
      if: ${{ github.event.inputs.specific_cafe == '' }}
      env:
        GOOGLE_APPLICATION_CREDENTIALS: "firebase_credentials.json"
        GITHUB_ACTIONS: "true"
      run: |
        if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
          python scripts/run_crawler.py --all --test --notify --dry-run --output data/beans_test.json
        else
          python scripts/run_crawler.py --all --notify --dry-run --output data/beans_production.json \
            --record-events --events-output data/bean_events.json
        fi
    
    - name: Run coffee crawler (specific cafe, dry-run artifact only)
      if: ${{ github.event.inputs.specific_cafe != '' }}
      env:
        GOOGLE_APPLICATION_CREDENTIALS: "firebase_credentials.json"
        GITHUB_ACTIONS: "true"
      run: |
        if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
          python scripts/run_crawler.py --cafe ${{ github.event.inputs.specific_cafe }} --test --notify --dry-run --output data/beans_${{ github.event.inputs.specific_cafe }}.json
        else
          python scripts/run_crawler.py --cafe ${{ github.event.inputs.specific_cafe }} --notify --dry-run --output data/beans_${{ github.event.inputs.specific_cafe }}.json \
            --record-events --events-output data/bean_events.json
        fi

    # 일부 카페가 실패해도 나머지 정상 데이터는 반영해야 한다. 여기서 job을 끊으면
    # 멀쩡한 로스터리 10곳까지 갱신이 멈춰 오히려 데이터가 더 낡는다.
    # 결과는 continue-on-error로 받아두고 마지막 단계에서 job을 실패시킨다.
    - name: Validate crawl output
      id: validate
      continue-on-error: true
      run: |
        if [ "${{ github.event.inputs.specific_cafe }}" = "" ]; then
          TARGET="data/beans_production.json"
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            TARGET="data/beans_test.json"
          fi
          python scripts/validate_crawl_output.py "$TARGET" --allow-zero "$ALLOW_ZERO_BRANDS"
        else
          TARGET="data/beans_${{ github.event.inputs.specific_cafe }}.json"
          python scripts/validate_crawl_output.py "$TARGET"
        fi

    # 산출물이 통째로 비었을 때만 반영을 막는다. 그건 전면 장애라 덮어쓰면 위험하다.
    - name: Guard against empty crawl
      if: ${{ github.event.inputs.test_mode != 'true' }}
      run: |
        TARGET="data/beans_production.json"
        if [ -n "${{ github.event.inputs.specific_cafe }}" ]; then
          TARGET="data/beans_${{ github.event.inputs.specific_cafe }}.json"
        fi
        COUNT=$(python -c "import json,sys; print(len(json.load(open('$TARGET', encoding='utf-8'))))")
        echo "crawl rows: $COUNT"
        if [ "$COUNT" -eq 0 ]; then
          echo "::error::크롤 결과가 0건이다. Firestore 반영을 중단한다."
          exit 1
        fi

    - name: Apply validated crawl to Firestore (all cafes)
      if: ${{ github.event.inputs.test_mode != 'true' && github.event.inputs.specific_cafe == '' }}
      run: |
        node scripts/reset_all_active_cafes_from_crawl.mjs data/beans_production.json

    - name: Apply validated crawl to Firestore (specific cafe)
      if: ${{ github.event.inputs.test_mode != 'true' && github.event.inputs.specific_cafe != '' }}
      run: |
        BRAND=$(python - <<'PY'
        import yaml
        cfg = yaml.safe_load(open('config/crawler_config.yaml', encoding='utf-8'))
        cafe = "${{ github.event.inputs.specific_cafe }}"
        print(cfg['cafes'][cafe]['label'])
        PY
        )
        node scripts/reset_single_brand_from_crawl.mjs data/beans_${{ github.event.inputs.specific_cafe }}.json "$BRAND"

    # 무료 유입 엔진: 텔레그램 공개 채널에 신상/재입고/가격 인하 다이제스트 발행
    - name: Publish Telegram channel digest
      if: ${{ github.event.inputs.test_mode != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
      continue-on-error: true
      run: |
        if [ -f "data/bean_events.json" ]; then
          python -m coffee_crawler.utils.telegram_notifier --events data/bean_events.json
        else
          echo "변경 이벤트 파일이 없어 다이제스트 발행을 건너뜁니다."
        fi

    # 프리미엄 판정은 이 아래 알림 단계에서 매일 돈다. 조용히 틀리면 두 방향
    # 모두 손해다 — 만료를 놓치면 결제를 멈춘 사람이 영구 프리미엄이고,
    # 잘못 만료시키면 돈 낸 사람의 알림이 끊긴다. 보내기 전에 확인한다.
    # (continue-on-error를 두지 않는다. 판정이 깨졌으면 보내지 않는 편이 낫다.)
    - name: Check premium resolution
      if: ${{ github.event.inputs.test_mode != 'true' }}
      run: python scripts/test_premium_resolve.py

    # 유료 상품: 즐겨찾기 원두 재입고/가격 변동 DM
    - name: Send favorite bean alerts
      if: ${{ github.event.inputs.test_mode != 'true' && env.TELEGRAM_BOT_TOKEN != '' }}
      continue-on-error: true
      env:
        GOOGLE_APPLICATION_CREDENTIALS: "firebase_credentials.json"
      run: |
        python scripts/send_favorite_alerts.py --since-hours 25

    - name: Generate summary report
      run: |
        python -c "
        import json
        import os
        from datetime import datetime
        
        # 결과 파일 찾기
        data_files = [f for f in os.listdir('data') if f.startswith('beans_') and f.endswith('.json')]
        
        total_beans = 0
        cafe_stats = {}
        
        for file in data_files:
            try:
                with open(f'data/{file}', 'r', encoding='utf-8') as f:
                    data = json.load(f)
                    count = len(data) if isinstance(data, list) else 0
                    total_beans += count
                    cafe_name = file.replace('beans_', '').replace('.json', '')
                    cafe_stats[cafe_name] = count
                    print(f'✅ {cafe_name}: {count}개 원두')
            except Exception as e:
                print(f'❌ {file} 처리 실패: {e}')
        
        print(f'📊 총 수집된 원두: {total_beans}개')
        print(f'🏪 처리된 카페: {len(cafe_stats)}개')
        
        # 리포트 생성
        report = {
            'timestamp': datetime.now().isoformat(),
            'total_beans': total_beans,
            'cafe_breakdown': cafe_stats,
            'github_actions': True
        }
        
        os.makedirs('reports', exist_ok=True)
        with open('reports/crawl_summary.json', 'w', encoding='utf-8') as f:
            json.dump(report, f, ensure_ascii=False, indent=2)
        
        print('📄 리포트 생성 완료: reports/crawl_summary.json')
        "
    
    - name: Send Notion summary
      id: notion_sync
      if: always()
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WORKFLOW_STATUS: ${{ job.status }}
      run: |
        python scripts/post_notion_summary.py

    - name: Upload crawl results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: crawl-results-${{ github.run_number }}
        path: |
          data/
          reports/
          logs/
        retention-days: 30
    
    - name: Send Discord notification
      if: always()
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        NOTION_RESULT: ${{ steps.notion_sync.outcome }}
      run: |
        if [ -n "$DISCORD_WEBHOOK" ] && [ -f "reports/crawl_summary.json" ]; then
          python -c "
          import json
          import requests
          import os
          from datetime import datetime
          
          webhook_url = os.getenv('DISCORD_WEBHOOK')
          thread_id = os.getenv('DISCORD_THREAD_ID', '').strip()
          run_url = os.getenv('RUN_URL', '').strip()
          notion_result = os.getenv('NOTION_RESULT', 'unknown').strip()
          target_url = webhook_url
          if thread_id:
              sep = '&' if '?' in webhook_url else '?'
              target_url = f"{webhook_url}{sep}thread_id={thread_id}"
          
          try:
              with open('reports/crawl_summary.json', 'r', encoding='utf-8') as f:
                  report = json.load(f)
              
              total = report.get('total_beans', 0)
              cafes = report.get('cafe_breakdown', {})
              
              # 상태에 따른 색상
              color = 0x00ff00 if total > 50 else (0xffff00 if total > 20 else 0xff0000)
              top_lines = [f'{cafe}: {count}개' for cafe, count in list(cafes.items())[:10]]
              cafe_text = '\n'.join(top_lines) if top_lines else '수집 데이터 없음'
              
              embed = {
                  'title': '☕️ 커피 크롤러 주간 실행 완료',
                  'description': '주간 크롤링이 완료되었습니다.',
                  'color': color,
                  'timestamp': datetime.now().isoformat(),
                  'fields': [
                      {
                          'name': '📊 수집 결과',
                          'value': f'총 {total}개 원두 정보 수집',
                          'inline': True
                      },
                      {
                          'name': '🧾 Notion 적재',
                          'value': f'{notion_result}',
                          'inline': True
                      },
                      {
                          'name': '🏪 처리된 카페(최대 10개)',
                          'value': cafe_text,
                          'inline': False
                      },
                      {
                          'name': '🔗 실행 링크',
                          'value': run_url if run_url else '없음',
                          'inline': False
                      }
                  ],
                  'footer': {
                      'text': 'GitHub Actions 주간 자동 실행'
                  }
              }
              
              payload = {'embeds': [embed]}
              response = requests.post(target_url, json=payload, timeout=20)
              
              if response.status_code == 204:
                  print('✅ Discord 알림 전송 완료')
              else:
                  print(f'❌ Discord 알림 전송 실패: {response.status_code}')
                  
          except Exception as e:
              print(f'❌ 알림 처리 중 오류: {e}')
              # 오류 알림 전송
              error_embed = {
                  'title': '❌ 커피 크롤러 오류 발생',
                  'description': f'```{str(e)}```',
                  'color': 0xff0000,
                  'timestamp': datetime.now().isoformat()
              }
              requests.post(target_url, json={'embeds': [error_embed]}, timeout=20)
          "
        else
          echo "Discord 웹훅이 설정되지 않았거나 리포트 파일이 없습니다."
        fi

    # 정상 데이터는 이미 반영됐다. 수집이 멈춘 카페가 있으면 여기서 빨갛게 남긴다.
    - name: Fail if any active cafe collected nothing
      if: ${{ steps.validate.outcome == 'failure' }}
      run: |
        echo "::error::활성 카페 중 수집 0건이 있다. 위 'Validate crawl output' 로그의 missing_brands를 확인할 것."
        exit 1
